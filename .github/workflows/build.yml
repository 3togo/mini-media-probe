name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config zlib1g-dev ffmpeg
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config ffmpeg
      - run: python scripts/build.py --jobs 3 --require-duration-fixtures
      - run: ctest --test-dir build-native-broad --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ runner.os }}-${{ runner.arch }}
          path: |
            build-native-broad/mini-media-probe
            build-native-broad/licenses/
            build-native-broad/ffmpeg-configuration.txt
            sources.json
            LICENSE
  windows:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ffmpeg
      - run: python scripts/build.py --jobs 3 --require-duration-fixtures
      - run: ctest --test-dir build-native-broad --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: helper-Windows-X64
          path: |
            build-native-broad/mini-media-probe.exe
            build-native-broad/licenses/
            build-native-broad/ffmpeg-configuration.txt
            sources.json
            LICENSE
